<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - AI Prompt Library</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        input[type="file"] {
            padding: 10px;
            background: #fafafa;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1565c0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        .note {
            margin-top: 15px;
            padding: 12px;
            background: #f1f5ff;
            border-radius: 8px;
            font-size: 14px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #e8f5e9;
            color: #1b5e20;
        }

        .error {
            background: #ffebee;
            color: #b71c1c;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>➕ Add New Prompt</h1>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        {% if error %}
            <div class="message error">
                {{ error }}
            </div>
        {% endif %}

        <form
            action="/admin/add-prompt"
            method="POST"
            enctype="multipart/form-data"
        >

            <label>Title</label>

            <input
                type="text"
                name="title"
                placeholder="Example: Realistic Dog Vlogger"
                required
            >


            <label>Prompt</label>

            <textarea
                name="prompt"
                placeholder="Yahan complete AI image/video prompt likho..."
                required
            ></textarea>


            <label>Image / Video</label>

            <input
                type="file"
                name="media"
                accept="image/*,video/*"
                required
            >


            <button type="submit">
                🚀 Add Prompt
            </button>

        </form>

        <div class="note">
            💡 New prompt add karte hi woh user website par
            sabse upar दिखाई देगा।
            Latest 5 prompts automatically
            <b>🔥 TRENDING</b> mein दिखाई देंगे।
        </div>

    </div>

</div>

</body>
</html>
